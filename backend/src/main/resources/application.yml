server:
  port: 8080

spring:
  # 本地真实凭据放在 backend/application-local.yml（已被 .gitignore 忽略），
  # 模板见同目录 application-local.yml.example
  config:
    import: optional:file:./application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/super_patient?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

app:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:superpatient-dev-secret}
  upload:
    # 报告照片落盘目录（不在静态资源目录下，读取需经 /api/files/{id} 鉴权）
    dir: ${UPLOAD_DIR:./uploads}
  agent:
    # Python Agent 服务（agent/server.py），关闭时解读自动降级为规则摘要
    enabled: ${AGENT_ENABLED:false}
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8001}
    model: ${AGENT_MODEL:qwen-plus}
    # 仅本地开发：随 Spring Boot 一起拉起 agent/server.py（生产应交由进程管理器）
    auto-start: ${AGENT_AUTO_START:false}
    script: ${AGENT_SCRIPT:../agent/server.py}
    port: ${AGENT_PORT:8001}
  extract:
    double-read:
      # 精读：同一张图识别两次并仲裁不一致的行，耗时和成本约 2-3 倍
      enabled: ${DOUBLE_READ:false}
  llm:
    # mock=返回固定样本（无需 Key）；qwen=调用通义千问 VL
    provider: ${LLM_PROVIDER:mock}
    base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${LLM_MODEL:qwen-vl-max-latest}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.superpatient.entity

logging:
  level:
    com.superpatient: debug
    org.springframework.jdbc.support.JdbcTransactionManager: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
