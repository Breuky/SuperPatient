name: CI

# 每次推送或提 PR 都跑一遍：编译 + 单测 + 前端构建
# 不部署、不连数据库——所有单测都是 Mock 的，几秒到几分钟就能出结果
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支连续 push 时取消上一次，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: 后端 · 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 单测全部用 Mock，不需要 MySQL 和 Redis
      - name: mvn test
        working-directory: backend
        run: mvn -B test

      - name: 汇总测试结果
        if: always()
        working-directory: backend
        run: |
          if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
            grep -h "Tests run:" target/surefire-reports/*.txt \
              | awk -F'[:,]' '{t+=$2; f+=$4; e+=$6} END {printf "共 %d 个测试，失败 %d，错误 %d\n", t, f, e}'
          fi

      - name: 上传失败用例报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/Web/package-lock.json

      # ci 而不是 install：严格按 lock 文件装，lock 与 package.json 不一致会直接失败
      - name: 安装依赖
        working-directory: frontend/Web
        run: npm ci

      - name: 构建
        working-directory: frontend/Web
        run: npm run build

  agent:
    name: Agent · 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # agent 只用标准库，没有第三方依赖，不需要 pip install
      - name: unittest
        run: python -m unittest discover -s agent -p "test_*.py" -v
